name: AH-DevOps-Pipeline-tests-docker-deploy

on: 
  push:
    branches: [ "main"]
  workflow_dispatch: 
    inputs:
      create_artefakt:
        description: 'Do you want to create an artefakt if tests fails?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: run tests
        id: tests
        shell: bash
        run: | 
          set +e
          pytest -v > artefakt.log
          echo "result=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload artefakt if failure
        if: ${{ inputs.create_artefakt == 'true' && steps.tests.outputs.result != '0' }}    
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: artefakt.log

      - name: Fail if tests failed
        if: ${{ steps.tests.outputs.result != '0' }}
        run: exit 1
  
  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    env:
      REPO: alejandrohiroshima/alejandro

    steps:
      - name: Check out code
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: display build info
        run: echo "Building and pushing image from: ${{ github.ref }} to dockerhub repo: ${{ env.REPO }} - run number: ${{ github.run_number }}"

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with: 
          context: .
          file: ./dockerfile 
          push: true
          tags: |
            ${{ env.REPO }}:latest
            ${{ env.REPO }}:${{ github.run_number }} 

      - name: Confirm push
        if: success()
        run: echo "Docker image built and pushed to ${{ env.REPO }}"

      - name: Confirm failure
        if: failure()
        run: |
          echo "Docker image build/push failed"
          exit 1

  terraform:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    env: 
      TERRAFORM_VERSION: 1.9.8 

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup Terraform
        uses: hashicorp/setup-terraform@v3
        with: 
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform plan
        run: terraform plan -out=tfplan -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        working-directory: ./terraform
      
      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform